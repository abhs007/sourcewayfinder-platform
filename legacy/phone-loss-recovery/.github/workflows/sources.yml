name: Monitor official sources
on:
  schedule:
    - cron: '30 14 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run sources:check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-availability-report
          path: source-reports/latest.json
